# =============================================================================
# Gisila Panel — schema definition.
# =============================================================================
#
# All models below are generated by `dart run build_runner build` into
# `schema.gisila.g.dart` (Dart classes) and `schema.gisila.up.sql` /
# `schema.gisila.down.sql` (Postgres migrations).
#
# Naming conventions:
#   - snake_case for column names in YAML (auto-mapped to camelCase in Dart).
#   - Foreign keys named after the referenced model.
#   - Timestamps standardised on `created_at` / `updated_at`.
# =============================================================================

# ───────────────────────────── Identity & access ─────────────────────────────

User:
  columns:
    first_name:
      type: varchar
      is_null: true
      allow_blank: true
    last_name:
      type: varchar
      is_null: true
      allow_blank: true
    email:
      type: varchar
      is_unique: true
      is_index: true
    password:
      type: varchar
      is_null: true
    is_active:
      type: boolean
      default: true
    is_staff:
      type: boolean
      default: false
    is_superuser:
      type: boolean
      default: false
    is_email_verified:
      type: boolean
      default: false
    avatar_url:
      type: varchar
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

Team:
  columns:
    name:
      type: varchar
      is_null: false
    slug:
      type: varchar
      is_unique: true
      is_index: true
    owner:
      type: foreign_key
      references: User
      is_null: false
      reverse_name: owned_teams
      on_delete: cascade
    plan:
      type: varchar
      default: free      # free | starter | pro | enterprise
    created_at:
      type: timestamp
      is_null: false

TeamMember:
  columns:
    team:
      type: foreign_key
      references: Team
      is_null: false
      reverse_name: members
      on_delete: cascade
    user:
      type: foreign_key
      references: User
      is_null: false
      reverse_name: team_memberships
      on_delete: cascade
    role:
      type: varchar
      default: developer  # owner | admin | developer | viewer
    invited_at:
      type: timestamp
      is_null: false
    accepted_at:
      type: timestamp
      is_null: true

ApiToken:
  columns:
    user:
      type: foreign_key
      references: User
      is_null: false
      reverse_name: api_tokens
      on_delete: cascade
    name:
      type: varchar
      is_null: false
    token_hash:
      type: varchar
      is_unique: true
      is_index: true
    prefix:
      type: varchar          # first 8 chars shown to user, indexed for lookup
      is_index: true
    last_used_at:
      type: timestamp
      is_null: true
    expires_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false

SshKey:
  columns:
    user:
      type: foreign_key
      references: User
      is_null: false
      reverse_name: ssh_keys
      on_delete: cascade
    name:
      type: varchar
      is_null: false
    algorithm:
      type: varchar
      is_null: true          # ed25519 | rsa-4096 | rsa-2048 | ecdsa-p256 | ecdsa-p384
    public_key:
      type: text
      is_null: false
    # Private key is only present for keys generated by the panel.
    # It is stored as-is (PEM/OpenSSH format). In production you should
    # encrypt this column at the DB level or via application-level AES.
    private_key:
      type: text
      is_null: true
    is_deploy_key:
      type: boolean
      default: false         # true = generated for git deploy use
    fingerprint:
      type: varchar
      is_unique: true
      is_index: true
    created_at:
      type: timestamp
      is_null: false

# ───────────────────────────── Projects & apps ───────────────────────────────

Project:
  columns:
    team:
      type: foreign_key
      references: Team
      is_null: false
      reverse_name: projects
      on_delete: cascade
    name:
      type: varchar
      is_null: false
    slug:
      type: varchar
      is_index: true
    description:
      type: text
      is_null: true
    created_at:
      type: timestamp
      is_null: false

App:
  columns:
    project:
      type: foreign_key
      references: Project
      is_null: false
      reverse_name: apps
      on_delete: cascade
    name:
      type: varchar
      is_null: false
    slug:
      type: varchar
      is_index: true
    # Linux primitives the agent provisions / owns.
    linux_user:
      type: varchar
      is_unique: true
      is_index: true
    work_dir:
      type: varchar
      is_null: false
    internal_port:
      type: integer
      is_unique: true
      is_index: true
    # Runtime + source.
    runtime:
      type: varchar          # dart | go | rust | zig | bun | node | python | binary
      is_null: false
    source_type:
      type: varchar          # binary | git | zip
      is_null: false
    git_url:
      type: varchar
      is_null: true
    git_branch:
      type: varchar
      is_null: true
    build_command:
      type: varchar
      is_null: true
    start_command:
      type: varchar
      is_null: true
    health_check_path:
      type: varchar
      is_null: true          # e.g. /health
    # Optional deploy key used for authenticated git clone.
    deploy_key:
      type: foreign_key
      references: SshKey
      is_null: true
      reverse_name: deployed_apps
      on_delete: set null
    # Python-specific fields (only relevant when runtime = python).
    python_version:
      type: varchar
      is_null: true          # pyenv version string, e.g. 3.12.4
    python_mode:
      type: varchar
      is_null: true          # wsgi | asgi  (default: wsgi when null)
    wsgi_app:
      type: varchar
      is_null: true          # gunicorn app target, e.g. myapp.wsgi:application
    # Resource limits (translated into systemd MemoryMax / CPUQuota / TasksMax).
    memory_mb_limit:
      type: integer
      default: 256
    cpu_quota_percent:
      type: integer
      default: 50
    tasks_limit:
      type: integer
      default: 100
    # Lifecycle.
    status:
      type: varchar          # created | building | running | stopped | failed | crashed
      default: created
    last_deployed_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

EnvVar:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: env_vars
      on_delete: cascade
    name:
      type: varchar
      is_null: false
    value:
      type: text
      is_null: true
    is_secret:
      type: boolean
      default: false
    updated_at:
      type: timestamp
      is_null: false

# ─────────────────────────── Deployments & builds ────────────────────────────

Deployment:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: deployments
      on_delete: cascade
    triggered_by:
      type: foreign_key
      references: User
      is_null: true
      reverse_name: triggered_deployments
      on_delete: set null
    source_type:
      type: varchar          # binary | git | zip
      is_null: false
    git_commit_sha:
      type: varchar
      is_null: true
    artifact_path:
      type: varchar
      is_null: true          # /srv/apps/app_X/releases/<id>/app
    status:
      type: varchar          # queued | building | deploying | succeeded | failed | rolled_back
      default: queued
    failure_reason:
      type: text
      is_null: true
    is_active:
      type: boolean
      default: false
    started_at:
      type: timestamp
      is_null: true
    finished_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false

BuildLog:
  columns:
    deployment:
      type: foreign_key
      references: Deployment
      is_null: false
      reverse_name: build_logs
      on_delete: cascade
    line:
      type: text
      is_null: false
    stream:
      type: varchar
      default: stdout        # stdout | stderr | system
    created_at:
      type: timestamp
      is_null: false

# ───────────────────────────── Domains & SSL ─────────────────────────────────

Domain:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: domains
      on_delete: cascade
    hostname:
      type: varchar
      is_unique: true
      is_index: true
    is_primary:
      type: boolean
      default: false
    is_verified:
      type: boolean
      default: false
    verification_token:
      type: varchar
      is_null: true
    ssl_status:
      type: varchar          # none | pending | issued | expired | failed
      default: none
    ssl_expires_at:
      type: timestamp
      is_null: true
    ssl_issuer:
      type: varchar
      is_null: true
    created_at:
      type: timestamp
      is_null: false

# ───────────────────────────── Observability ─────────────────────────────────

MetricSample:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: metrics
      on_delete: cascade
    cpu_percent:
      type: integer          # 0..10_000 (basis points, two decimal places)
      default: 0
    mem_bytes:
      type: integer
      default: 0
    rss_bytes:
      type: integer
      default: 0
    sampled_at:
      type: timestamp
      is_null: false

AppEvent:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: events
      on_delete: cascade
    actor:
      type: foreign_key
      references: User
      is_null: true
      reverse_name: app_events
      on_delete: set null
    kind:
      type: varchar          # deploy | restart | stop | scale | domain_add | env_set | rollback
      is_null: false
    message:
      type: text
      is_null: true
    data:
      type: text             # JSON blob
      is_null: true
    created_at:
      type: timestamp
      is_null: false

# ─────────────────────────── Managed services ────────────────────────────────
#
# Host-level services (Redis, Memcached, email relays, etc.) that the panel
# can install, configure, start/stop, and surface connection strings to apps.

ManagedService:
  columns:
    service_type:
      type: varchar            # redis | memcached | smtp | mailpit
      is_null: false
      is_index: true
    display_name:
      type: varchar
      is_null: false
    status:
      type: varchar
      default: pending         # pending | installing | running | stopped | failed | uninstalling | config_only
    config:
      type: text
      default: '{}'            # JSON — field values from the config schema
    error_message:
      type: text
      is_null: true
    installed_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

# ─────────────────────────── PostgreSQL instances ────────────────────────────
#
# Each installed Postgres version is a PostgresInstance.
# Users and databases provisioned inside an instance are PostgresDatabases.

PostgresInstance:
  columns:
    version:
      type: integer              # 14 | 15 | 16 | 17 | 18
      is_null: false
    display_name:
      type: varchar
      is_null: false
    port:
      type: integer
      is_null: false
      is_unique: true
      is_index: true
    status:
      type: varchar
      default: pending           # pending | installing | running | stopped | failed | uninstalling
    is_default:
      type: boolean
      default: false
    data_directory:
      type: varchar
      is_null: true
    error_message:
      type: text
      is_null: true
    installed_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

PostgresDatabase:
  columns:
    instance:
      type: foreign_key
      references: PostgresInstance
      is_null: false
      reverse_name: databases
      on_delete: cascade
    db_name:
      type: varchar
      is_null: false
    role_name:
      type: varchar
      is_null: false
    password:
      type: varchar
      is_null: false             # stored encrypted; shown once to the user
    extensions:
      type: text
      default: '[]'             # JSON array of extension names
    status:
      type: varchar
      default: pending           # pending | active | failed | dropped
    error_message:
      type: text
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

AuditLog:
  columns:
    actor:
      type: foreign_key
      references: User
      is_null: true
      reverse_name: audit_entries
      on_delete: set null
    team:
      type: foreign_key
      references: Team
      is_null: true
      reverse_name: audit_entries
      on_delete: set null
    action:
      type: varchar
      is_null: false
    target_type:
      type: varchar
      is_null: true
    target_id:
      type: varchar
      is_null: true
    ip_address:
      type: varchar
      is_null: true
    user_agent:
      type: varchar
      is_null: true
    data:
      type: text
      is_null: true
    created_at:
      type: timestamp
      is_null: false
