# =============================================================================
# Gisila Panel — schema definition.
# =============================================================================
#
# All models below are generated by `dart run build_runner build` into
# `schema.gisila.g.dart` (Dart classes) and `schema.gisila.up.sql` /
# `schema.gisila.down.sql` (Postgres migrations).
#
# Naming conventions:
#   - snake_case for column names in YAML (auto-mapped to camelCase in Dart).
#   - Foreign keys named after the referenced model.
#   - Timestamps standardised on `created_at` / `updated_at`.
# =============================================================================

# ───────────────────────────── Identity & access ─────────────────────────────

User:
  columns:
    first_name:
      type: varchar
      is_null: true
      allow_blank: true
    last_name:
      type: varchar
      is_null: true
      allow_blank: true
    email:
      type: varchar
      is_unique: true
      is_index: true
    password:
      type: varchar
      is_null: true
    is_active:
      type: boolean
      default: true
    is_staff:
      type: boolean
      default: false
    is_superuser:
      type: boolean
      default: false
    is_email_verified:
      type: boolean
      default: false
    avatar_url:
      type: varchar
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

Team:
  columns:
    name:
      type: varchar
      is_null: false
    slug:
      type: varchar
      is_unique: true
      is_index: true
    owner:
      type: foreign_key
      references: User
      is_null: false
      reverse_name: owned_teams
      on_delete: cascade
    plan:
      type: varchar
      default: free      # free | starter | pro | enterprise
    created_at:
      type: timestamp
      is_null: false

TeamMember:
  columns:
    team:
      type: foreign_key
      references: Team
      is_null: false
      reverse_name: members
      on_delete: cascade
    user:
      type: foreign_key
      references: User
      is_null: false
      reverse_name: team_memberships
      on_delete: cascade
    role:
      type: varchar
      default: developer  # owner | admin | developer | viewer
    invited_at:
      type: timestamp
      is_null: false
    accepted_at:
      type: timestamp
      is_null: true

ApiToken:
  columns:
    user:
      type: foreign_key
      references: User
      is_null: false
      reverse_name: api_tokens
      on_delete: cascade
    name:
      type: varchar
      is_null: false
    token_hash:
      type: varchar
      is_unique: true
      is_index: true
    prefix:
      type: varchar          # first 8 chars shown to user, indexed for lookup
      is_index: true
    last_used_at:
      type: timestamp
      is_null: true
    expires_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false

SshKey:
  columns:
    user:
      type: foreign_key
      references: User
      is_null: false
      reverse_name: ssh_keys
      on_delete: cascade
    name:
      type: varchar
      is_null: false
    algorithm:
      type: varchar
      is_null: true          # ed25519 | rsa-4096 | rsa-2048 | ecdsa-p256 | ecdsa-p384
    public_key:
      type: text
      is_null: false
    # Private key is only present for keys generated by the panel.
    # It is stored as-is (PEM/OpenSSH format). In production you should
    # encrypt this column at the DB level or via application-level AES.
    private_key:
      type: text
      is_null: true
    is_deploy_key:
      type: boolean
      default: false         # true = generated for git deploy use
    fingerprint:
      type: varchar
      is_unique: true
      is_index: true
    created_at:
      type: timestamp
      is_null: false

# ───────────────────────────── Projects & apps ───────────────────────────────

Project:
  columns:
    team:
      type: foreign_key
      references: Team
      is_null: false
      reverse_name: projects
      on_delete: cascade
    name:
      type: varchar
      is_null: false
    slug:
      type: varchar
      is_index: true
    description:
      type: text
      is_null: true
    created_at:
      type: timestamp
      is_null: false

App:
  columns:
    project:
      type: foreign_key
      references: Project
      is_null: false
      reverse_name: apps
      on_delete: cascade
    name:
      type: varchar
      is_null: false
    slug:
      type: varchar
      is_index: true
    # Linux primitives the agent provisions / owns.
    linux_user:
      type: varchar
      is_unique: true
      is_index: true
    work_dir:
      type: varchar
      is_null: false
    internal_port:
      type: integer
      is_unique: true
      is_index: true
    # Runtime + source.
    runtime:
      type: varchar          # dart | go | rust | zig | bun | node | python | binary | celery | static
      is_null: false
    source_type:
      type: varchar          # binary | git | zip
      is_null: false
    git_url:
      type: varchar
      is_null: true
    git_branch:
      type: varchar
      is_null: true
    build_command:
      type: varchar
      is_null: true
    start_command:
      type: varchar
      is_null: true
    health_check_path:
      type: varchar
      is_null: true          # e.g. /health
    # Optional deploy key used for authenticated git clone.
    deploy_key:
      type: foreign_key
      references: SshKey
      is_null: true
      reverse_name: deployed_apps
      on_delete: set null
    # Python-specific fields (only relevant when runtime = python).
    python_version:
      type: varchar
      is_null: true          # pyenv version string, e.g. 3.12.4
    python_mode:
      type: varchar
      is_null: true          # wsgi | asgi  (default: wsgi when null)
    wsgi_app:
      type: varchar
      is_null: true          # gunicorn app target, e.g. myapp.wsgi:application
    # Gunicorn tuning (only relevant when runtime = python). Null → sensible defaults.
    gunicorn_workers:
      type: integer
      is_null: true          # number of worker processes (default 4)
    gunicorn_threads:
      type: integer
      is_null: true          # threads per worker (default 1)
    gunicorn_timeout:
      type: integer
      is_null: true          # worker timeout in seconds (default 120)
    gunicorn_bind:
      type: varchar
      is_null: true          # bind address override, e.g. 0.0.0.0:8000 (default 0.0.0.0:$PORT)
    gunicorn_extra_args:
      type: varchar
      is_null: true          # extra raw gunicorn flags appended verbatim
    # Runtime version pins (each only relevant for its respective runtime).
    # When null the agent falls back to whatever is installed on the host.
    node_version:
      type: varchar
      is_null: true          # e.g. 20.18.0 | 22.11.0
    dart_version:
      type: varchar
      is_null: true          # e.g. 3.4.4
    go_version:
      type: varchar
      is_null: true          # e.g. 1.22.9
    rust_version:
      type: varchar
      is_null: true          # e.g. stable | 1.81.0 | nightly
    bun_version:
      type: varchar
      is_null: true          # e.g. 1.1.38
    # Celery-specific fields (only relevant when runtime = celery).
    celery_app:
      type: varchar
      is_null: true          # Celery app import path, e.g. myproject.celery or proj.celery:app
    celery_worker_count:
      type: integer
      is_null: true          # number of worker processes (default 2)
    celery_concurrency:
      type: integer
      is_null: true          # concurrency per worker process (default 4)
    celery_queues:
      type: varchar
      is_null: true          # comma-separated queue names (default: celery)
    celery_beat_enabled:
      type: boolean
      default: false         # launch celery beat scheduler alongside workers
    celery_extra_args:
      type: varchar
      is_null: true          # extra raw celery worker flags appended verbatim
    # Static serving fields (only relevant when runtime = static).
    static_root:
      type: varchar
      is_null: true          # path within the repo to serve, e.g. dist or public
    static_spa:
      type: boolean
      default: false         # SPA mode: fall back all routes to index.html
    # Local disk media (Model A). When enabled the agent creates a persistent
    # shared/media directory, injects MEDIA_ROOT into the app's env, and nginx
    # serves it at /media/ (public) plus an internal /_protected/ location the
    # app can hand off to via X-Accel-Redirect for auth-gated downloads.
    media_enabled:
      type: boolean
      default: false
    media_max_upload_mb:
      type: integer
      default: 25            # per-app nginx client_max_body_size for uploads
    # Resource limits (translated into systemd MemoryMax / CPUQuota / TasksMax).
    memory_mb_limit:
      type: integer
      default: 256
    cpu_quota_percent:
      type: integer
      default: 50
    tasks_limit:
      type: integer
      default: 100
    # Lifecycle.
    status:
      type: varchar          # created | building | running | stopped | failed | crashed
      default: created
    last_deployed_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

EnvVar:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: env_vars
      on_delete: cascade
    name:
      type: varchar
      is_null: false
    value:
      type: text
      is_null: true
    is_secret:
      type: boolean
      default: false
    updated_at:
      type: timestamp
      is_null: false

# ─────────────────────────── Deployments & builds ────────────────────────────

Deployment:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: deployments
      on_delete: cascade
    triggered_by:
      type: foreign_key
      references: User
      is_null: true
      reverse_name: triggered_deployments
      on_delete: set null
    source_type:
      type: varchar          # binary | git | zip
      is_null: false
    git_commit_sha:
      type: varchar
      is_null: true
    artifact_path:
      type: varchar
      is_null: true          # /srv/apps/app_X/releases/<id>/app
    status:
      type: varchar          # queued | building | deploying | succeeded | failed | rolled_back
      default: queued
    failure_reason:
      type: text
      is_null: true
    is_active:
      type: boolean
      default: false
    started_at:
      type: timestamp
      is_null: true
    finished_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false

BuildLog:
  columns:
    deployment:
      type: foreign_key
      references: Deployment
      is_null: false
      reverse_name: build_logs
      on_delete: cascade
    line:
      type: text
      is_null: false
    stream:
      type: varchar
      default: stdout        # stdout | stderr | system
    created_at:
      type: timestamp
      is_null: false

# ───────────────────────────── Domains & SSL ─────────────────────────────────

Domain:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: domains
      on_delete: cascade
    hostname:
      type: varchar
      is_unique: true
      is_index: true
    is_primary:
      type: boolean
      default: false
    is_verified:
      type: boolean
      default: false
    verification_token:
      type: varchar
      is_null: true
    ssl_status:
      type: varchar          # none | pending | issued | expired | failed
      default: none
    ssl_expires_at:
      type: timestamp
      is_null: true
    ssl_issuer:
      type: varchar
      is_null: true
    created_at:
      type: timestamp
      is_null: false

# ───────────────────────────── Observability ─────────────────────────────────

MetricSample:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: metrics
      on_delete: cascade
    cpu_percent:
      type: integer          # 0..10_000 (basis points, two decimal places)
      default: 0
    mem_bytes:
      type: integer
      default: 0
    rss_bytes:
      type: integer
      default: 0
    sampled_at:
      type: timestamp
      is_null: false

AppEvent:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: events
      on_delete: cascade
    actor:
      type: foreign_key
      references: User
      is_null: true
      reverse_name: app_events
      on_delete: set null
    kind:
      type: varchar          # deploy | restart | stop | scale | domain_add | env_set | rollback
      is_null: false
    message:
      type: text
      is_null: true
    data:
      type: text             # JSON blob
      is_null: true
    created_at:
      type: timestamp
      is_null: false

# ─────────────────────────── Managed services ────────────────────────────────
#
# Host-level services (Redis, Memcached, email relays, etc.) that the panel
# can install, configure, start/stop, and surface connection strings to apps.

ManagedService:
  columns:
    service_type:
      type: varchar            # redis | memcached | smtp | mailpit
      is_null: false
      is_index: true
    display_name:
      type: varchar
      is_null: false
    status:
      type: varchar
      default: pending         # pending | installing | running | stopped | failed | uninstalling | config_only
    config:
      type: text
      default: '{}'            # JSON — field values from the config schema
    error_message:
      type: text
      is_null: true
    installed_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

# ─────────────────────────── PostgreSQL instances ────────────────────────────
#
# Each installed Postgres version is a PostgresInstance.
# Users and databases provisioned inside an instance are PostgresDatabases.

PostgresInstance:
  columns:
    version:
      type: integer              # 14 | 15 | 16 | 17 | 18
      is_null: false
    display_name:
      type: varchar
      is_null: false
    port:
      type: integer
      is_null: false
      is_unique: true
      is_index: true
    status:
      type: varchar
      default: pending           # pending | installing | running | stopped | failed | uninstalling
    is_default:
      type: boolean
      default: false
    # Public exposure: when true the cluster listens on all interfaces with TLS
    # (Let's Encrypt cert for public_domain) and a hostssl pg_hba rule, so it is
    # reachable at public_domain:port with sslmode=verify-full.
    is_public:
      type: boolean
      default: false
    public_domain:
      type: varchar
      is_null: true
    # Password for the read-only `gisila_monitor` role the panel uses to query
    # pg_stat_* metrics. Created on install; null on legacy instances until the
    # first metrics request provisions it.
    monitor_password:
      type: varchar
      is_null: true
    data_directory:
      type: varchar
      is_null: true
    error_message:
      type: text
      is_null: true
    installed_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

PostgresDatabase:
  columns:
    instance:
      type: foreign_key
      references: PostgresInstance
      is_null: false
      reverse_name: databases
      on_delete: cascade
    db_name:
      type: varchar
      is_null: false
    role_name:
      type: varchar
      is_null: false
    password:
      type: varchar
      is_null: false             # stored encrypted; shown once to the user
    extensions:
      type: text
      default: '[]'             # JSON array of extension names
    role_attributes:
      type: text
      default: '[]'             # JSON array of granted role attributes
                                # (CREATEDB, CREATEROLE, REPLICATION, …)
    status:
      type: varchar
      default: pending           # pending | active | failed | dropped
    error_message:
      type: text
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

# Recurring backup configuration for a single database (one row per database).
# The backup scheduler (Timer.periodic in the worker) enqueues a dump whenever
# next_run_at falls due, then advances next_run_at to the next slot.
PostgresBackupSchedule:
  columns:
    database:
      type: foreign_key
      references: PostgresDatabase
      is_null: false
      is_unique: true
      reverse_name: backup_schedule
      on_delete: cascade
    enabled:
      type: boolean
      default: false
    frequency:
      type: varchar
      default: daily             # hourly | daily | weekly
    hour:
      type: integer
      default: 2                 # hour of day (UTC) for daily/weekly
    minute:
      type: integer
      default: 0
    weekday:
      type: integer
      is_null: true              # 0=Sunday … 6=Saturday, used when frequency=weekly
    scope:
      type: varchar
      default: full              # full | schema | data
    keep_count:
      type: integer
      default: 7                 # retention: keep the N most recent backups
    next_run_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

# A single backup artifact (a pg_dump .sql.gz file on disk) for a database.
PostgresBackup:
  columns:
    database:
      type: foreign_key
      references: PostgresDatabase
      is_null: false
      reverse_name: backups
      on_delete: cascade
    file_path:
      type: varchar
      is_null: true              # absolute path on the host, set once completed
    file_name:
      type: varchar
      is_null: true              # display name / download filename
    size_bytes:
      type: bigint
      is_null: true
    scope:
      type: varchar
      default: full              # full | schema | data
    status:
      type: varchar
      default: pending           # pending | running | completed | failed
    trigger:
      type: varchar
      default: manual            # manual | scheduled
    error_message:
      type: text
      is_null: true
    started_at:
      type: timestamp
      is_null: true
    completed_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false

# ─────────────────────────── Object storage (S3) ─────────────────────────────
#
# S3-compatible object storage (Model B). A StorageProvider is an endpoint:
# either the self-hosted MinIO managed service (kind=minio — the panel installs
# and runs it) or an external S3/R2/B2 connector (kind=external — credentials
# only, nothing installed). Buckets and scoped access keys are provisioned inside
# a provider and surfaced to apps as S3_* env vars via AppStorageLink.

StorageProvider:
  columns:
    kind:
      type: varchar              # minio | external
      is_null: false
      is_index: true
    display_name:
      type: varchar
      is_null: false
    # S3 API endpoint, e.g. http://127.0.0.1:9000 (minio) or
    # https://<account>.r2.cloudflarestorage.com (external).
    endpoint:
      type: varchar
      is_null: false
    region:
      type: varchar
      default: us-east-1
    # Base URL for public object reads (nginx-fronted MinIO or a CDN). Surfaced
    # to apps as <PREFIX>_PUBLIC_URL when set.
    public_url:
      type: varchar
      is_null: true
    # Public URL for the MinIO web console (kind=minio only). Served by its own
    # nginx vhost on a dedicated hostname (the console can't share the S3 API
    # host — bucket paths would collide).
    console_url:
      type: varchar
      is_null: true
    # Admin / root credentials used to provision buckets + scoped keys. Stored
    # as-is (encrypt at the DB layer in production, like SshKey.private_key).
    access_key:
      type: varchar
      is_null: false
    secret_key:
      type: varchar
      is_null: false
    # MinIO + most non-AWS providers require path-style addressing.
    force_path_style:
      type: boolean
      default: true
    # MinIO web console port (kind=minio only); null for external providers.
    console_port:
      type: integer
      is_null: true
    status:
      type: varchar
      default: pending           # pending | installing | running | stopped | failed | uninstalling | config_only
    error_message:
      type: text
      is_null: true
    installed_at:
      type: timestamp
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

StorageBucket:
  columns:
    provider:
      type: foreign_key
      references: StorageProvider
      is_null: false
      reverse_name: buckets
      on_delete: cascade
    bucket_name:
      type: varchar
      is_null: false
    # Scoped access key/secret for this bucket. For MinIO the agent mints a
    # dedicated user limited to this bucket; for external providers these mirror
    # the provider credentials (no IAM user minting over plain S3).
    access_key:
      type: varchar
      is_null: false
    secret_key:
      type: varchar
      is_null: false             # shown once on creation
    is_public:
      type: boolean
      default: false             # anonymous (public) read policy on the bucket
    status:
      type: varchar
      default: pending           # pending | active | failed | deleted
    error_message:
      type: text
      is_null: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

# Links a bucket to an app and drives credential auto-injection: creating the
# link writes <prefix>_ENDPOINT / _REGION / _BUCKET / _ACCESS_KEY / _SECRET_KEY /
# _PUBLIC_URL / _FORCE_PATH_STYLE into the app's EnvVars (live on next deploy);
# deleting it removes them.
AppStorageLink:
  columns:
    app:
      type: foreign_key
      references: App
      is_null: false
      reverse_name: storage_links
      on_delete: cascade
    bucket:
      type: foreign_key
      references: StorageBucket
      is_null: false
      reverse_name: app_links
      on_delete: cascade
    env_prefix:
      type: varchar
      default: S3                # env var prefix (allows >1 bucket per app)
    created_at:
      type: timestamp
      is_null: false

# ─────────────────────────── Mail server ─────────────────────────────────────
#
# Virtual-mailbox email hosting on top of Postfix (MTA) + Dovecot (IMAP/POP3).
# Domains and mailboxes are stored here and synced to the host's virtual maps by
# the agent, so a single Postfix/Dovecot install can serve many domains/accounts.

MailDomain:
  columns:
    domain:
      type: varchar
      is_unique: true
      is_index: true
      is_null: false
    # Public hostname the MX/A records point at (e.g. mail.example.com).
    # Editable per domain; defaults to mail.<domain> when null.
    mail_hostname:
      type: varchar
      is_null: true
    # DKIM signing selector and the public key (filled in by the agent on sync).
    dkim_selector:
      type: varchar
      default: gisila
    dkim_public_key:
      type: text
      is_null: true
    # DMARC policy advertised in the _dmarc TXT record: none | quarantine | reject.
    dmarc_policy:
      type: varchar
      default: none
    # Public IP detected by the agent on the last sync (for the A record).
    public_ip:
      type: varchar
      is_null: true
    is_active:
      type: boolean
      default: true
    created_at:
      type: timestamp
      is_null: false

MailAccount:
  columns:
    mail_domain:
      type: foreign_key
      references: MailDomain
      is_null: false
      reverse_name: accounts
      on_delete: cascade
    address:                      # full email address local@domain
      type: varchar
      is_unique: true
      is_index: true
      is_null: false
    # Dovecot/Postfix-compatible password hash (e.g. {SHA512-CRYPT}…).
    password_hash:
      type: varchar
      is_null: false
    quota_mb:
      type: integer
      is_null: true               # null = unlimited
    is_active:
      type: boolean
      default: true
    created_at:
      type: timestamp
      is_null: false
    updated_at:
      type: timestamp
      is_null: true

AuditLog:
  columns:
    actor:
      type: foreign_key
      references: User
      is_null: true
      reverse_name: audit_entries
      on_delete: set null
    team:
      type: foreign_key
      references: Team
      is_null: true
      reverse_name: audit_entries
      on_delete: set null
    action:
      type: varchar
      is_null: false
    target_type:
      type: varchar
      is_null: true
    target_id:
      type: varchar
      is_null: true
    ip_address:
      type: varchar
      is_null: true
    user_agent:
      type: varchar
      is_null: true
    data:
      type: text
      is_null: true
    created_at:
