name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build release tarball
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          VERSION="$VERSION" bash infra/build-release.sh

      - name: Create GitHub Release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          ARCH="${{ matrix.arch }}"
          TARBALL="dist/gisila-release-linux-${ARCH}.tar.gz"
          VERSION_FILE="dist/VERSION"

          # Create the release (skip if it already exists, e.g. created manually
          # or by the other arch job racing us).
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Gisila Panel $TAG" \
            --generate-notes \
            || true

          # Both jobs upload VERSION with --clobber; content is identical.
          gh release upload "$TAG" "$TARBALL" "$VERSION_FILE" \
            --repo "${{ github.repository }}" \
            --clobber
