# Managed by gisila-panel — vhost for the panel itself.
#
# Installers rewrite `panel.example.com` when PANEL_DOMAIN is set. Otherwise
# replace it by hand, then:
#   certbot --nginx -d panel.example.com
# Or re-run the installer with PANEL_DOMAIN=… ISSUE_TLS=1.
#
# The Dart API server (port 8000) now serves both the REST API and the
# compiled panel UI. No separate Node.js/Next.js process is needed.

# Send the WebSocket upgrade headers ONLY for real upgrade requests. For a
# normal request `$http_upgrade` is empty, so `Connection` resolves to "close"
# and no bogus `Upgrade`/`Connection: upgrade` pair is forwarded. Without this,
# every request (including the login POST) carries `Connection: upgrade`, which
# dart:io treats as an upgrade attempt and never hands the request body to the
# app — logins then fail with "email/password required".
map $http_upgrade $gisila_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Everything goes to the Dart API which serves both the REST API
    # and the panel UI static files (built from frontend/).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (/ws/apps/*/logs) — conditional, see map above.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gisila_connection_upgrade;
        proxy_read_timeout 75s;
    }

    client_max_body_size 50M;
    access_log /var/log/nginx/gisila-panel.access.log;
    error_log  /var/log/nginx/gisila-panel.error.log;
}
